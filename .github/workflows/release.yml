# LOQ Monitor | Release workflow
# Author: cahyata
# Copyright (c) 2026 cahyata
#
# Pushing a tag such as v0.1.1 builds the installer, signs the update package and publishes a GitHub
# Release with the installer and latest.json, which the app reads to find updates. The tag must match
# "version" in ui/src-tauri/tauri.conf.json.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri

      - name: Check that the tag matches the app version
        shell: pwsh
        run: |
          $version = (Get-Content ui/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match version $version in tauri.conf.json."
          }

      - name: Publish the sensor service
        run: dotnet publish SensorService -c Release -r win-x64 --self-contained true -o SensorService/publish

      - name: Add PresentMon for the overlay frame rate
        shell: pwsh
        run: ./scripts/get-presentmon.ps1 -Destination SensorService/publish

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Test the UI rules
        working-directory: ui
        run: npm test

      - name: Collect the license texts the installer ships
        run: node scripts/collect-licenses.mjs

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ui
          tagName: ${{ github.ref_name }}
          releaseName: LOQ Monitor ${{ github.ref_name }}
          releaseBody: Changes are listed below.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis

      - name: Write the release notes from CHANGELOG.md
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          ./scripts/release-notes.ps1 -Version $version | Set-Content -Path release-notes.md -Encoding utf8
          gh release edit "${{ github.ref_name }}" --notes-file release-notes.md
